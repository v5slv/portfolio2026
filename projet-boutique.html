<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valérie Lapeyre — UX Researcher</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/projet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="media/favicon-180.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="/index.html" class="logo-top-link"
          ><img src="media/trefle-40.png" alt="Haut de l'accueil"
        /></a>
      </nav>
      <div class="lang-switcher" role="group" aria-label="Langue">
        <button
          id="btn-fr"
          class="lang-btn active"
          aria-pressed="true"
          onclick="changeLang('fr')"
        >
          FR
        </button>
        <span aria-hidden="true" class="separator">✦</span>
        <button
          id="btn-en"
          class="lang-btn"
          aria-pressed="false"
          onclick="changeLang('en')"
        >
          EN
        </button>
      </div>
    </header>
    <main>
      <div class="hero-container">
        <section class="hero">
          <div class="hero-img">
            <img src="media/project-1-hero.jpg" alt="" />
          </div>
          <div class="hero-title-text">
            <h1 class="hero-title">La boutique d'Elise</h1>
            <div class="hero-text">
              <p class="hero-caption">Recherche UX</p>
              <p class="hero-description">
                Création du site de vente en ligne d’Elise, créatrice d’objets
                d’art upcyclés
              </p>
              <p class="hero-add">
                En collaboration avec
                <a
                  href="https://claramy.github.io/portfolio-2026/"
                  rel="noopener noreferrer"
                  target="_blank"
                  >Clara</a
                >
                et
                <a
                  href="https://eliseceladon.github.io/portfolio-2026/"
                  rel="noopener noreferrer"
                  target="_blank"
                  >Elise</a
                >
              </p>
            </div>
            <div class="hero-date-link">
              <p class="hero-date">2026</p>
              <a
                href="https://elise-celadon.fr/?woo-share=avmt19FPHMkNWvM2aklFYylIqurrzcug"
                target="_blank"
                rel="noopener noreferrer"
                >Voir le projet</a
              >
            </div>
          </div>
        </section>
      </div>
      <section class="video">
        <video
          src="media/video-boutique-elise.webm"
          controls
          aria-label="Démo du site"
        ></video>
      </section>
      <section></section>
    </main>
    <footer>
      <a href="/mentions-legales.html" rel="noopener noreferrer"
        >Mentions légales</a
      >
      <span class="separator" aria-hidden="true">✦</span>
      <address>
        <a href="mailto:valerie.lpyr@gmail.com">valerie.lpyr@gmail.com</a>
        <span class="separator" aria-hidden="true">✦</span>
        <a
          href="https://linkedin.com/in/valerie-lapeyre-945000222"
          rel="noopener noreferrer"
          target="_blank"
          >LinkedIn</a
        >
      </address>
    </footer>
  </body>
</html>
